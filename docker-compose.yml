services:
  api:
    build: .
    ports:
      - "5203:5203"
    volumes:
      - ./:/app
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    restart: always
    ports:
      - "3900:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - app
    environment:
      POSTGRES_USER: escoutdoor
      POSTGRES_PASSWORD: ivan
      POSTGRES_DB: bookit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escoutdoor -d bookit"]
      interval: 10s
      timeout: 5s
      retries: 3
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data/ --console-address ":9001"
    ports:
      - "9000"
      - "9001"
    networks:
      - app
    environment:
      MINIO_ROOT_USER: escivan
      MINIO_ROOT_PASSWORD: bookit2024
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 3
  redis:
    image: redis:latest
    ports:
      - "4375:6379"
    volumes:
      - redis:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


volumes:
  postgres:
  minio:
  redis:

networks:
  app:
    driver: bridge
